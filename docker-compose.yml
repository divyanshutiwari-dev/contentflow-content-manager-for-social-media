services:
  # ==========================================
  # Java 21 Spring Boot 3 REST API Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contentflow-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      - APP_CORS_ALLOWED_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - JAVA_OPTS=${JAVA_OPTS:--Xms256m -Xmx512m}
    volumes:
      - contentflow-db-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - contentflow-net

  # ==========================================
  # Next.js 14 App Router Frontend Dashboard
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    container_name: contentflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - contentflow-net

# ==========================================
# Named Volumes for Persistent Database Storage
# ==========================================
volumes:
  contentflow-db-data:
    driver: local

# ==========================================
# Bridge Network for Inter-Container Routing
# ==========================================
networks:
  contentflow-net:
    driver: bridge
